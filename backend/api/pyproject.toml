[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kew-api"
version = "0.1.0"
description = "FastAPI gateway for the Knowledge Engineering Workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Architecture Team" }]
keywords = ["fastapi", "kew", "architecture", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "google-adk>=2.3.0",
    "google-genai>=2.8,<3",
    "cursor-sdk>=0.1.8",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]
engine = [
    "documentation-ai-factory",
]

[project.scripts]
kew-api = "kew_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kew_api = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kew_api"]
