[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documentation-ai-factory"
version = "0.1.0"
description = "Local-first AI-powered documentation and research platform for Architecture Space"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Architecture Team" }]
keywords = ["documentation", "agents", "adk", "gemini", "architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "google-adk>=2.3.0",
    "google-genai>=2.8,<3",
    "tavily-python>=0.5.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "markdown-it-py>=3.0,<4",
    "pyyaml>=6.0.2,<7",
    "jinja2>=3.1,<4",
    "click>=8.1.8,<9",
    "python-dotenv>=1,<2",
    "tenacity>=9,<10",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[project.scripts]
doc-factory = "doc_factory.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_factory = ["prompts/**/*.txt", "taxonomy/*.yaml", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["doc_factory"]
