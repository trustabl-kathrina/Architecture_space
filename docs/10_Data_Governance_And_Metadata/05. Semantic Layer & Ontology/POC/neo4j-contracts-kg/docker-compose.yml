services:
  neo4j:
    image: neo4j:5.26-community
    container_name: contracts-kg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/contracts-kg
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - contracts_kg_data:/data
      - contracts_kg_logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./cypher:/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  contracts_kg_data:
  contracts_kg_logs:
