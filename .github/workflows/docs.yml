name: Documentation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate front matter
        run: python code/scripts/validate_front_matter.py

      - name: Validate links
        run: python code/scripts/validate_links.py

      - name: Status report
        run: python code/scripts/status_report.py

  build-docs:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r code/requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict -f code/mkdocs.yml

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: code/site/

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r code/requirements-docs.txt

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force -f code/mkdocs.yml
